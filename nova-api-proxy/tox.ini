[tox]
envlist = pep8,pylint,black
minversion = 4.4.0
skipsdist = True
toxworkdir = /tmp/{env:USER}_novaapiproxytox

[novaapiproxy]
nova_api_proxy_base_dir = .
nova_api_proxy_dir = ./nova-api-proxy

# Default environment targets Trixie (python3.13). Bullseye environments
# override basepython/deps via the [bullseye] section.
[testenv]
basepython = python3.13
sitepackages = False
deps =
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt}
    -r{toxinidir}/test-requirements.txt

# Bullseye (python3.9) base config. Referenced by the *-bullseye envs.
[bullseye]
basepython = python3.9
deps =
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt}
    -r{toxinidir}/test-requirements-bullseye.txt

[flake8]
show-source = True
max-line-length = 88
# Suppressed flake8 codes
# E203 whitespace before ':'; conflict with Black
# H301 one import per line; conflict with Black
# W503 line break before binary operator; conflict with Black
ignore = E203,H301,W503

[testenv:pep8]
allowlist_externals = mkdir
# TODO(dgr1): Fix F824 (unused globals)
commands =
    mkdir -p {envdir}/log
    flake8 --extend-ignore=F824 {[novaapiproxy]nova_api_proxy_base_dir}

[testenv:pylint]
allowlist_externals = mkdir
# TODO(dgr1): Fix R0917 (too-many-positional-arguments) new in pylint 3.x
commands =
    mkdir -p {envdir}/log
    pylint {[novaapiproxy]nova_api_proxy_dir} --rcfile=.pylintrc --disable=too-many-positional-arguments

[testenv:black]
# This environment checks and displays the recommended changes by Black for formatting
# Python files.
# To apply the format in a specific file, use the following command: black {posargs} .
allowlist_externals = mkdir
deps =
    black>=23.11.0 # MIT
commands =
    mkdir -p {envdir}/log
    black --check --diff .

[testenv:coverage]
deps =
    {[testenv]deps}
    -e{[novaapiproxy]nova_api_proxy_dir}
allowlist_externals =
    bash
    mkdir
commands =
    mkdir -p {envdir}/log
    mkdir -p {toxinidir}/UTCoverage
    bash -c "cd {toxinidir} && \
    pytest {[novaapiproxy]nova_api_proxy_dir}/nova_api_proxy/tests/ \
    --cov={[novaapiproxy]nova_api_proxy_dir}/nova_api_proxy \
    --cov-report=term-missing \
    --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
    --cov-report=xml:{toxinidir}/UTCoverage/coverage.xml \
    --cov-fail-under=24 \
    -v --tb=short > {toxinidir}/UTCoverage/coverage_report.txt 2>&1"

[testenv:pep8-bullseye]
basepython = {[bullseye]basepython}
deps = {[bullseye]deps}
commands =
    flake8 {[novaapiproxy]nova_api_proxy_base_dir}

[testenv:pylint-bullseye]
basepython = {[bullseye]basepython}
deps = {[bullseye]deps}
commands = pylint {[novaapiproxy]nova_api_proxy_dir} --rcfile=.pylintrc

[testenv:black-bullseye]
basepython = {[bullseye]basepython}
deps =
    black>=23.11.0 # MIT
commands =
    black --check --diff .

[testenv:coverage-bullseye]
basepython = {[bullseye]basepython}
deps =
    {[bullseye]deps}
    -e{[novaapiproxy]nova_api_proxy_dir}
allowlist_externals =
    bash
    mkdir
commands =
    mkdir -p {toxinidir}/UTCoverage
    bash -c "cd {toxinidir} && \
    pytest {[novaapiproxy]nova_api_proxy_dir}/nova_api_proxy/tests/ \
    --cov={[novaapiproxy]nova_api_proxy_dir}/nova_api_proxy \
    --cov-report=term-missing \
    --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
    --cov-report=xml:{toxinidir}/UTCoverage/coverage.xml \
    --cov-fail-under=24 \
    -v --tb=short > {toxinidir}/UTCoverage/coverage_report.txt 2>&1"
