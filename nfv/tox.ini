# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.
[tox]
envlist = pep8,pylint,black,py313,coverage
minversion = 4.4.0
skipsdist = True
toxworkdir = /tmp/{env:USER}_nfvtox

[nfv]
nfv_base_dir = .
nfv_client_dir = ./nfv-client
nfv_common_dir = ./nfv-common
nfv_plugins_dir = ./nfv-plugins
nfv_vim_dir = ./nfv-vim
nfv_test_dir = ./nfv-tests
stx_fault_dir = ../../fault
stx_tsconfig_dir = ../../config/tsconfig/tsconfig
stx_software_dir = ../../update/software
stx_utilities_dir = ../../utilities/utilities/platform-util/platform-util

nfv_client_src_dir = {[nfv]nfv_client_dir}/nfv_client
nfv_common_src_dir = {[nfv]nfv_common_dir}/nfv_common
nfv_plugins_src_dir = {[nfv]nfv_plugins_dir}/nfv_plugins
nfv_vim_src_dir = {[nfv]nfv_vim_dir}/nfv_vim
nfv_test_src_dir = {[nfv]nfv_test_dir}

# Default environment targets Trixie (python3.13). Bullseye environments
# override basepython/deps via the [bullseye] section.
[testenv]
basepython = python3.13
sitepackages = False
deps =
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt}
    -r{toxinidir}/test-requirements.txt
    -e{[nfv]nfv_client_dir}
    -e{[nfv]nfv_common_dir}
    -e{[nfv]nfv_plugins_dir}
    -e{[nfv]nfv_vim_dir}
    -e{[nfv]stx_fault_dir}/fm-api/source
    -e{[nfv]stx_tsconfig_dir}
    -e{[nfv]stx_software_dir}
    -e{[nfv]stx_utilities_dir}

# Bullseye (python3.9) base config. Referenced by the *-bullseye envs.
[bullseye]
basepython = python3.9
deps =
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt}
    -r{toxinidir}/test-requirements-bullseye.txt
    -e{[nfv]nfv_client_dir}
    -e{[nfv]nfv_common_dir}
    -e{[nfv]nfv_plugins_dir}
    -e{[nfv]nfv_vim_dir}
    -e{[nfv]stx_fault_dir}/fm-api/source
    -e{[nfv]stx_tsconfig_dir}
    -e{[nfv]stx_software_dir}
    -e{[nfv]stx_utilities_dir}

[nosetests]
verbosity=2

[flake8]
show-source = True
max-line-length = 88
# Suppressed flake8 codes
# E203 whitespace before ':'; conflict with Black
# H301 one import per line; conflict with Black
# W503 line break before binary operator; conflict with Black
ignore = E203,H301,W503
builtins = _
exclude = .tox,./nfv-tests/nfv_unit_tests/build

[bandit]
# These are the bandit codes that are failing for nfv
# B104: hardcoded_bind_all_interfaces
# B108: Probable insecure usage of temp file/directory
# B110: Try, Except, Pass detected.
# B310: Audit url open for permitted schemes
# TODO(dgr1): B101, B404, B603, B607 are newly flagged by the newer bandit
# from the Trixie constraints. Fix and remove these skips.
# B101: assert_used
# B404: import_subprocess
# B603: subprocess_without_shell_equals_true
# B607: start_process_with_partial_path
skips = B101,B104,B108,B110,B310,B404,B603,B607
exclude = .tox,./nfv-docs,./nfv-tests,./nfv-debug-tools,unit_test

[testenv:pep8]
allowlist_externals = mkdir
# TODO(dgr1): Fix F824 (unused globals) and H906 (LOG.warn->LOG.warning)
commands =
    mkdir -p {envdir}/log
    flake8 --extend-ignore=F824,H906 {[nfv]nfv_base_dir}

[testenv:pylint]
allowlist_externals = mkdir
deps =
    {[testenv]deps}
    {[nfv]nfv_test_dir}/nfv_unit_tests
    {[nfv]nfv_test_dir}/nfv_scenario_tests
    jinja2
# TODO(dgr1): Fix pre-existing source issues surfaced by pylint 3.x / py3.13:
#   too-many-positional-arguments: R0917, new in pylint 3.x (249 hits)
#   no-member: E1101, false positive on urllib.request
#   use-maxsplit-arg: C0207, style suggestion in nfvi_infrastructure_api.py
#   consider-using-min-builtin: R1730, style in _vim_nfvi_audits.py
#   consider-using-max-builtin: R1731, style in _vim_nfvi_audits.py
#   import-error: E0401, distutils.version removed in py3.12+
#   deprecated-module: W4901, distutils.version
commands =
    mkdir -p {envdir}/log
    pylint {[nfv]nfv_client_src_dir}  \
                  {[nfv]nfv_common_src_dir}  \
                  {[nfv]nfv_plugins_src_dir} \
                  {[nfv]nfv_vim_src_dir}     \
                  {[nfv]nfv_test_src_dir}/nfv_unit_tests     \
                  --rcfile=./.pylintrc \
                  --disable=too-many-positional-arguments,no-member,use-maxsplit-arg,consider-using-min-builtin,consider-using-max-builtin,import-error,deprecated-module

[testenv:black]
# This environment checks and displays the recommended changes by Black for formatting
# Python files.
# To apply the format in a specific file, use the following command: black {posargs} .
deps =
    black>=23.11.0 # MIT
allowlist_externals = mkdir
commands =
    mkdir -p {envdir}/log
    black --check --diff .

[testenv:py313]
allowlist_externals =
    mkdir
    cp
    stestr
commands =
    mkdir -p {envdir}/log
    cp -v {[nfv]nfv_base_dir}/nfv-tests/nfv_unit_tests/test_data/nfv_vim_db_stx_25.09 {envdir}/
    stestr --test-path={[nfv]nfv_base_dir}/nfv-tests/nfv_unit_tests/tests run '{posargs}'
    stestr slowest

[testenv:coverage]
setenv =
    PYTHON=coverage run --parallel-mode
allowlist_externals =
    mkdir
    cp
    stestr
commands =
    mkdir -p {envdir}/log
    mkdir -p {toxinidir}/UTCoverage
    cp -v {[nfv]nfv_base_dir}/nfv-tests/nfv_unit_tests/test_data/nfv_vim_db_stx_25.09 {envdir}/
    coverage erase
    stestr --test-path={[nfv]nfv_base_dir}/nfv-tests/nfv_unit_tests/tests run "{posargs}"
    coverage combine
    coverage html -d {toxinidir}/UTCoverage/htmlcov
    coverage xml -o {toxinidir}/UTCoverage/coverage.xml
    coverage report --fail-under=24

[testenv:bandit]
deps = bandit
allowlist_externals = mkdir
commands =
    mkdir -p {envdir}/log
    bandit --ini tox.ini -f txt -r {[nfv]nfv_base_dir}

[testenv:pep8-bullseye]
basepython = {[bullseye]basepython}
deps = {[bullseye]deps}
commands =
    flake8 {[nfv]nfv_base_dir}

[testenv:pylint-bullseye]
basepython = {[bullseye]basepython}
deps = {[bullseye]deps}
       {[nfv]nfv_test_dir}/nfv_unit_tests
       {[nfv]nfv_test_dir}/nfv_scenario_tests
       jinja2
commands = pylint {[nfv]nfv_client_src_dir}  \
                  {[nfv]nfv_common_src_dir}  \
                  {[nfv]nfv_plugins_src_dir} \
                  {[nfv]nfv_vim_src_dir}     \
                  {[nfv]nfv_test_src_dir}/nfv_unit_tests     \
                  --rcfile=./.pylintrc

[testenv:black-bullseye]
basepython = {[bullseye]basepython}
deps =
    black>=23.11.0 # MIT
commands =
    black --check --diff .

[testenv:py39-bullseye]
basepython = {[bullseye]basepython}
deps = {[bullseye]deps}
commands =
    cp -v {[nfv]nfv_base_dir}/nfv-tests/nfv_unit_tests/test_data/nfv_vim_db_stx_25.09 {envdir}/
    stestr --test-path={[nfv]nfv_base_dir}/nfv-tests/nfv_unit_tests/tests run '{posargs}'
    stestr slowest
allowlist_externals =
    mkdir
    cp
    stestr

[testenv:coverage-bullseye]
basepython = {[bullseye]basepython}
deps = {[bullseye]deps}
setenv =
    PYTHON=coverage run --parallel-mode
commands =
    mkdir -p {toxinidir}/UTCoverage
    cp -v {[nfv]nfv_base_dir}/nfv-tests/nfv_unit_tests/test_data/nfv_vim_db_stx_25.09 {envdir}/
    coverage erase
    stestr --test-path={[nfv]nfv_base_dir}/nfv-tests/nfv_unit_tests/tests run "{posargs}"
    coverage combine
    coverage html -d {toxinidir}/UTCoverage/htmlcov
    coverage xml -o {toxinidir}/UTCoverage/coverage.xml
    coverage report --fail-under=24
allowlist_externals =
    mkdir
    cp
    stestr

[testenv:bandit-bullseye]
basepython = {[bullseye]basepython}
deps = bandit
commands = bandit --ini tox.ini -f txt -r {[nfv]nfv_base_dir}
